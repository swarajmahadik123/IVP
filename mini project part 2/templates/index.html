<!DOCTYPE html>
<html>
<head>
    <title>Frame Change Detector</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; color: #333; }
        form { text-align: center; margin-top: 20px; }
        input[type="file"] { margin-bottom: 20px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Frame Change Detector</h1>
        <form method="post" enctype="multipart/form-data">
            <input type="file" name="video" accept="video/*" required><br>
            <button type="submit">Upload and Analyze</button>
        </form>
    </div>
</body>
</html>
